# MLOps Pipeline: test first on every push/PR; publish Docker images only after tests pass (push to main/master only).
#
# Publish rules:
#   - Job api-artifacts (after checkout) detects which .joblib files exist; publish jobs use those outputs.
#   - Default API image: api paths changed AND iris_model.joblib present.
#   - RF / SVC API images: api paths changed AND matching joblib present.
#   - Streamlit image: streamlit-ui code paths (not README).
#
# Required secrets (publish jobs): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

name: MLOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full stack (API from Hub + Streamlit built)
        run: |
          docker compose up -d
          echo "Waiting for services..."
          sleep 10

      - name: Smoke test API
        run: |
          curl -sf http://localhost:8000/ | grep -q "Welcome" || (echo "API health check failed"; exit 1)
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}' | grep -q "setosa" || (echo "API predict failed"; exit 1)
          echo "API smoke test passed"

      - name: Smoke test Streamlit UI
        run: |
          code=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8501) || code=000
          if [ "$code" = "200" ]; then echo "Streamlit UI reachable"; else echo "Streamlit returned $code (may need more time)"; fi

      - name: Tear down
        if: always()
        run: docker compose down -v

  path-filter:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      streamlit: ${{ steps.filter.outputs.streamlit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'main.py'
              - 'train_model.py'
              - 'create_model.py'
              - 'requirements.txt'
              - 'Dockerfile'
              - 'iris_model.joblib'
              - 'iris_model_rf.joblib'
              - 'iris_model_svc.joblib'
              - 'data/processed/**'
              - 'data/cleaned/**'
            streamlit:
              - 'streamlit-ui/app.py'
              - 'streamlit-ui/Dockerfile'
              - 'streamlit-ui/requirements.txt'

  # hashFiles() in job-level `if` runs before checkout (empty workspace). Scan repo after checkout instead.
  api-artifacts:
    needs: [test, path-filter]
    if: github.event_name == 'push' && needs.path-filter.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_default: ${{ steps.scan.outputs.has_default }}
      has_rf: ${{ steps.scan.outputs.has_rf }}
      has_svc: ${{ steps.scan.outputs.has_svc }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          if [ -f iris_model.joblib ]; then echo "has_default=true" >> "$GITHUB_OUTPUT"; else echo "has_default=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f iris_model_rf.joblib ]; then echo "has_rf=true" >> "$GITHUB_OUTPUT"; else echo "has_rf=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f iris_model_svc.joblib ]; then echo "has_svc=true" >> "$GITHUB_OUTPUT"; else echo "has_svc=false" >> "$GITHUB_OUTPUT"; fi

  publish-api-default:
    needs: [test, path-filter, api-artifacts]
    if: >-
      github.event_name == 'push'
      && needs.path-filter.outputs.api == 'true'
      && needs.api-artifacts.outputs.has_default == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-ml-model:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-ml-model:${{ github.sha }}
          build-args: |
            MODEL_FILE=iris_model.joblib
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-api-rf:
    needs: [test, path-filter, api-artifacts]
    if: >-
      github.event_name == 'push'
      && needs.path-filter.outputs.api == 'true'
      && needs.api-artifacts.outputs.has_rf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:rf
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:rf-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:rf-latest
          build-args: |
            MODEL_FILE=iris_model_rf.joblib
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-api-svc:
    needs: [test, path-filter, api-artifacts]
    if: >-
      github.event_name == 'push'
      && needs.path-filter.outputs.api == 'true'
      && needs.api-artifacts.outputs.has_svc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:svc
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:svc-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:svc-latest
          build-args: |
            MODEL_FILE=iris_model_svc.joblib
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-streamlit:
    needs: [test, path-filter]
    if: github.event_name == 'push' && needs.path-filter.outputs.streamlit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./streamlit-ui
          file: ./streamlit-ui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-streamlit-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-streamlit-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
